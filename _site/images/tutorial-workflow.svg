<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 170" font-family="Aptos, Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a8f6b"/>
    </marker>
  </defs>

  <!-- Step 1: Edit -->
  <rect x="10"  y="55" width="170" height="70" rx="8" ry="8" fill="#e9e2d3" stroke="#7a8f6b" stroke-width="2"/>
  <text x="95"  y="85"  text-anchor="middle" fill="#4a5d3a" font-size="14" font-weight="600">Edit .qmd files</text>
  <text x="95"  y="105" text-anchor="middle" fill="#2d2a26" font-size="13">on laptop</text>

  <line x1="180" y1="90" x2="218" y2="90" stroke="#7a8f6b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: GitHub Desktop -->
  <rect x="220" y="55" width="180" height="70" rx="8" ry="8" fill="#e9e2d3" stroke="#7a8f6b" stroke-width="2"/>
  <text x="310" y="85"  text-anchor="middle" fill="#4a5d3a" font-size="14" font-weight="600">GitHub Desktop</text>
  <text x="310" y="105" text-anchor="middle" fill="#2d2a26" font-size="13">Commit + Push</text>

  <line x1="400" y1="90" x2="438" y2="90" stroke="#7a8f6b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: GitHub Actions -->
  <rect x="440" y="55" width="180" height="70" rx="8" ry="8" fill="#e9e2d3" stroke="#7a8f6b" stroke-width="2"/>
  <text x="530" y="85"  text-anchor="middle" fill="#4a5d3a" font-size="14" font-weight="600">GitHub Actions</text>
  <text x="530" y="105" text-anchor="middle" fill="#2d2a26" font-size="13">runs quarto render</text>

  <line x1="620" y1="90" x2="658" y2="90" stroke="#7a8f6b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: gh-pages branch -->
  <rect x="660" y="55" width="180" height="70" rx="8" ry="8" fill="#e9e2d3" stroke="#7a8f6b" stroke-width="2"/>
  <text x="750" y="85"  text-anchor="middle" fill="#4a5d3a" font-size="14" font-weight="600">gh-pages branch</text>
  <text x="750" y="105" text-anchor="middle" fill="#2d2a26" font-size="13">rendered HTML</text>

  <line x1="840" y1="90" x2="878" y2="90" stroke="#7a8f6b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Live site -->
  <rect x="880" y="55" width="170" height="70" rx="8" ry="8" fill="#b8654a" stroke="#8f4a35" stroke-width="2"/>
  <text x="965" y="85"  text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">wantidah.github.io</text>
  <text x="965" y="105" text-anchor="middle" fill="#faf7f1" font-size="13">live site</text>

  <!-- Footer label -->
  <text x="530" y="155" text-anchor="middle" fill="#5a534a" font-size="12" font-style="italic">Publishing workflow</text>
</svg>
